<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Bài Viết - WEB TIN TỨC 24H</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1 class="logo">WEB TIN TỨC 24H</h1>
        </div>
        <nav class="navbar">
            <ul class="nav-list">
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="crawler.html">Crawler Tin Tức</a></li>
            </ul>
        </nav>
    </header>

    <main class="container detail-container">
        <!-- Nội dung chi tiết bài viết sẽ được JavaScript load vào đây -->
        <div id="detail-content"></div>
    </main>

    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-col">
                <h3>WEB TIN TỨC 24H</h3>
                <p>Trang tin tức tổng hợp nhanh chóng, chính xác mỗi ngày.</p>
            </div>
            <div class="footer-col">
                <h4>Liên Kết Nhanh</h4>
                <ul>
                    <li><a href="index.html">Trang chủ</a></li>
                    <li><a href="crawler.html">Crawler Tin Tức</a></li>
                </ul>
            </div>
            <div class="footer-col">
                <h4>Liên Hệ</h4>
                <p>Email: hotro@webtintuc.vn</p>
                <p>Địa chỉ: Hà Nội, Việt Nam</p>
            </div>
        </div>
    </footer>

    <!-- File JavaScript chính điều khiển trang chi tiết -->
    <script src="crawler.js"></script>

    <!-- Đoạn mã tự động xử lý và ẩn các hình ảnh bị lỗi do nguồn báo chặn -->
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const observer = new MutationObserver(function() {
            const images = document.querySelectorAll("img");
            images.forEach(img => {
                img.onerror = function() {
                    this.style.display = 'none'; // Tự động ẩn ảnh vỡ hình
                };
            });
        });

        // Tự động lắng nghe khi nội dung bài viết được load ra màn hình
        const target = document.body;
        observer.observe(target, { childList: true, subtree: true });
    });
    </script>
</body>
</html>
